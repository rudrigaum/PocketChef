name: PocketChef CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-v2-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-v2-
            
      - name: Create Dummy APIKeys.plist
        run: |
          cat <<EOF > PocketChef/Application/APIKeys.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>GEMINI_API_KEY</key>
              <string>DUMMY_VALUE_FOR_CI</string>
              <key>YOUTUBE_API_KEY</key>
              <string>DUMMY_VALUE_FOR_CI</string>
          </dict>
          </plist>
          EOF

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Run Tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available iPhone | grep "iPhone" | head -n 1 | grep -oE '[0-9A-F-]{36}')
          
          if [ -z "$SIMULATOR_ID" ]; then
            xcrun simctl create "iPhone CI" "iPhone 15"
            SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone CI" | grep -oE '[0-9A-F-]{36}')
          fi

          set -o pipefail && xcodebuild test \
            -project PocketChef.xcodeproj \
            -scheme PocketChef \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO
